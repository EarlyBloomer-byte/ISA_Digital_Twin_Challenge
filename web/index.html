<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>RouteTwin NG - Lagos-Ibadan corridor twin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="brand">RouteTwin NG <span class="sub">Lagos-Ibadan corridor</span></div>
  <div id="modeBadge" class="badge">-</div>
  <div id="clock" class="clock">-</div>
  <div class="spacer"></div>
  <label class="tokenbox" id="tokenBox" hidden>Operator token <input id="token" type="password" autocomplete="off"></label>
  <button id="btnPause">Pause</button>
  <button id="btnStop" hidden>Stop</button>
  <select id="speed" aria-label="Simulation speed (simulated time per real second)">
    <option value="1">10 min per second</option><option value="3">30 min per second</option>
    <option value="6" selected>1 hour per second</option><option value="12">2 hours per second</option>
    <option value="18">3 hours per second</option><option value="36">6 hours per second</option>
    <option value="72">12 hours per second</option><option value="144">1 day per second</option>
    <option value="216">1.5 days per second</option><option value="288">2 days per second</option>
  </select>
  <details class="menu" id="scenMenu">
    <summary id="scenSummary">Scenarios</summary>
    <div class="menu-body" id="scenBody"></div>
  </details>
</header>

<div class="runbar" id="runbar"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<dialog id="setup" aria-labelledby="setupTitle"></dialog>

<main class="grid">
  <aside class="left" aria-label="Segments">
    <h2>Segments</h2>
    <div id="segList" class="seglist"></div>
    <div class="legend">
      <div class="seg-layer" role="group" aria-label="Map layer">
        <button id="layerCond" class="on">Pavement condition</button>
        <button id="layerTraf">Traffic</button>
      </div>
      <label class="check" id="truthRow" hidden><input type="checkbox" id="truthToggle"> Show simulator ground truth</label>
      <div class="key" id="key"></div>
    </div>
  </aside>

  <section class="stage" aria-label="3D corridor view">
    <div id="three"></div>
    <div id="labels"></div>
    <button id="resetView" class="reset">Reset view</button>
    <div class="hint">Drag to rotate, scroll to zoom, right-drag to pan. Click a segment to inspect it.</div>
  </section>

  <aside class="right" aria-label="Operations">
    <div class="kpis" id="kpis"></div>
    <nav class="tabs" role="tablist">
      <button class="tab on" data-tab="alarms">Alarms</button>
      <button class="tab" data-tab="advisories">Reroute</button>
      <button class="tab" data-tab="maint">Maintenance</button>
      <button class="tab" data-tab="detail">Segment</button>
    </nav>
    <div id="tab-alarms" class="pane"></div>
    <div id="tab-advisories" class="pane" hidden></div>
    <div id="tab-maint" class="pane" hidden></div>
    <div id="tab-detail" class="pane" hidden></div>
  </aside>
</main>
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.umd.js"></script>
<script src="app.js"></script>
</body>
</html>
